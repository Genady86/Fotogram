<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram — Your personal photo album</title>
    <link rel="icon" href="./img/logo-fotogram.png">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>

    <header class="page-header">
        <img class="brand-logo" src="./img/logo-fotogram.png" alt="Fotogram">
    </header>

    <main class="page-main">
        <h1 class="page-title">Your personal photo album</h1>

        <section class="gallery-section">
            <h2 class="visually-hidden">Photo gallery</h2>
            <ul class="photo-gallery" id="fotogram-content"></ul>
        </section>
    </main>

    <footer class="page-footer">
        <img class="academy-logo" src="./img/logo-akademie.png" alt="Developer Akademie">
        <p class="copyright">&copy; 2023 Developer Akademie GmbH</p>
    </footer>

    <dialog class="image-overlay" id="image-overlay">
        <button id="close-dialog-btn">Close</button>

        <img id="dialog-image" alt="">
    </dialog>

</body>

</html>
